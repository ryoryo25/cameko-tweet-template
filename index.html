<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメコツイートジェネレータ | ≠ME / ≒JOY カメコ向けツイート作成ツール</title>
  <meta name="description" content="≠ME（ノットイコールミー）・≒JOY（ニアリーイコールジョイ）のライブ写真投稿用ツイートを簡単に作成できるジェネレータです。">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- OGP -->
  <meta property="og:title" content="カメコツイートジェネレータ">
  <meta property="og:description" content="≠ME・≒JOY のライブ写真投稿用ツイートを簡単に作成できるジェネレータ">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ryoryo25.github.io/cameko-tweet-template/">
  <meta property="og:image" content="https://ryoryo25.github.io/cameko-tweet-template/og-image.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="カメコツイートジェネレータ">
  <meta name="twitter:description" content="≠ME・≒JOY のライブ写真投稿用ツイートを簡単に作成できるジェネレータ">
  <meta name="twitter:image" content="https://ryoryo25.github.io/cameko-tweet-template/og-image.jpg">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="app-header__logo">
        <span class="app-header__icon">📸</span>
        <h1 class="app-header__title">カメコツイートジェネレータ</h1>
      </div>
      <p class="app-header__subtitle">≠ME / ≒JOY CAMERAMAN TWEET GENERATOR</p>
    </header>

    <!-- Input Card -->
    <section class="card" id="input-card">
      <h2 class="card__title">✏️ 入力</h2>

      <!-- Comment -->
      <div class="form-group">
        <label class="form-label" for="comment">
          コメント
          <span class="form-label__optional">任意</span>
        </label>
        <textarea
          class="form-textarea"
          id="comment"
          placeholder="写真に対するコメントを入力..."
          rows="3"
        ></textarea>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label class="form-label" for="event-date">
          日付
          <span class="form-label__optional">任意</span>
        </label>
        <input
          class="form-input"
          type="date"
          id="event-date"
        >
      </div>

      <!-- Live Name -->
      <div class="form-group">
        <label class="form-label" for="live-name">
          ライブ名
          <span class="form-label__optional">任意</span>
        </label>
        <input
          class="form-input"
          type="text"
          id="live-name"
          placeholder="例: ≠ME 5th Anniversary Tour"
        >

        <!-- Live Sub-options (Day / Part) -->
        <div class="live-options">
          <div class="live-option-row">
            <span class="live-option-label">Day:</span>
            <div class="chip-group" id="day-chips">
              <button type="button" class="chip active" data-day="">なし</button>
              <button type="button" class="chip" data-day="Day1">Day1</button>
              <button type="button" class="chip" data-day="Day2">Day2</button>
              <button type="button" class="chip" data-day="Day3">Day3</button>
            </div>
            <input type="text" class="form-input form-input--sm" id="custom-day" placeholder="Day数/その他">
          </div>

          <div class="live-option-row">
            <span class="live-option-label">部:</span>
            <div class="chip-group" id="part-chips">
              <button type="button" class="chip active" data-part="">なし</button>
              <button type="button" class="chip" data-part="昼の部">昼の部</button>
              <button type="button" class="chip" data-part="夜の部">夜の部</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Venue -->
      <div class="form-group">
        <label class="form-label" for="venue-name">
          会場名
          <span class="form-label__optional">任意</span>
        </label>
        <input
          class="form-input"
          type="text"
          id="venue-name"
          placeholder="例: 東京ガーデンシアター"
        >
      </div>

      <!-- Schedule Reference Links -->
      <div class="form-group">
        <p class="reference-links">
          📅 スケジュール参考：
          <a href="https://not-equal-me.jp/schedule/" target="_blank" rel="noopener noreferrer">≠ME</a>
          <span class="reference-links__sep">|</span>
          <a href="https://nearly-equal-joy.jp/schedule/" target="_blank" rel="noopener noreferrer">≒JOY</a>
        </p>
      </div>

      <!-- Members -->
      <div class="form-group">
        <label class="form-label">メンバー</label>
        <div id="member-group">
          <!-- Members will be populated by JS (grouped by ≠ME / ≒JOY) -->
        </div>
      </div>
    </section>

    <!-- Output Card -->
    <section class="card" id="output-card">
      <h2 class="card__title">📋 プレビュー</h2>

      <div class="output-section">
        <div class="output-preview" id="output-preview"></div>
        <div class="char-count" id="char-count"></div>
      </div>

      <div class="btn-group">
        <button class="btn btn--primary" id="copy-btn" type="button">
          📋 コピー
        </button>
        <button class="btn btn--secondary" id="clear-btn" type="button">
          🗑️ クリア
        </button>
      </div>
    </section>

  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">✅ クリップボードにコピーしました！</div>

  <script src="app.js"></script>
</body>
</html>
